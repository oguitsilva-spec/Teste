<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laudo de Hemograma Zog</title>
<meta name="theme-color" content="#312782">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laudo Zog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: faixa índigo da marca no topo com o logo; abaixo, à esquerda o fluxo (paciente → valores), à direita a folha do laudo; uma coluna no celular */
:root{
  --indigo:#312782; --sky:#35a8e0;
  --bg:#f3f4fa; --surface:#ffffff; --ink:#1c1a3f; --muted:#5d5b80; --line:#dcdcec;
  --field:#f6f7fc; --accent:#312782; --accent-ink:#ffffff; --accent-soft:#e3f2fb; --link:#1f86c0;
  --hi:#c43d1e; --hi-soft:#fde8e2; --lo:#1f6fb0; --lo-soft:#e1effa; --warn-soft:#fff4d1; --warn-ink:#684c00;
  --paper:#ffffff; --paper-ink:#111111;
  --font:"Montserrat","Gotham","Avenir Next","Segoe UI",system-ui,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12102b; --surface:#1c1940; --ink:#ecebfa; --muted:#a4a2c8; --line:#302c5c;
  --field:#15132f; --accent:#35a8e0; --accent-ink:#141038; --accent-soft:#1f2c55; --link:#6cc4ef;
  --hi:#ff9a7d; --hi-soft:#3d1f1e; --lo:#7cc3f0; --lo-soft:#173050; --warn-soft:#3a3010; --warn-ink:#f3d987;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12102b; --surface:#1c1940; --ink:#ecebfa; --muted:#a4a2c8; --line:#302c5c;
  --field:#15132f; --accent:#35a8e0; --accent-ink:#141038; --accent-soft:#1f2c55; --link:#6cc4ef;
  --hi:#ff9a7d; --hi-soft:#3d1f1e; --lo:#7cc3f0; --lo-soft:#173050; --warn-soft:#3a3010; --warn-ink:#f3d987;
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--indigo)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}

.brand{background:var(--indigo);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.brand-in{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand img{height:62px;width:auto;display:block}
.brand .ttl{display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:2px solid rgba(53,168,224,.55)}
.brand h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brand p{margin:0;color:#b9b5e6;font-size:.82rem;font-weight:500}
.gear{margin-left:auto;background:transparent;color:#fff;border:1.5px solid var(--sky)}
.gear:hover{background:rgba(53,168,224,.15)}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px calc(48px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;min-width:0}
.card h2{font-weight:800;font-size:1.05rem;margin:0 0 14px;display:flex;align-items:center;gap:10px;color:var(--ink);letter-spacing:.01em}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sky);color:#fff;font-size:.8rem;font-weight:800;flex:none}
.setup{border:1.5px solid var(--sky)}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.s2{grid-column:span 2}.f.s3{grid-column:span 3}.f.s6{grid-column:span 6}
@media (max-width:560px){.f.s2,.f.s3{grid-column:span 6}.f.half{grid-column:span 3}}
label,.lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
input,select{font:inherit;font-weight:500;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.age{display:flex;gap:6px}.age input{flex:1}.age select{width:auto}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 18px;letter-spacing:.01em}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:.88rem;color:var(--muted);min-height:1.2em;margin:0}
.status.err{color:var(--hi)}
.small{font-size:.8rem;color:var(--muted);margin:0}
.note{background:var(--warn-soft);color:var(--warn-ink);border-radius:10px;padding:9px 12px;font-size:.86rem;margin:0 0 10px}
.refbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--link);font-size:.78rem;font-weight:700}
.tbl{overflow-x:auto;margin-bottom:10px}
table.vals{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:440px}
table.vals th{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;font-weight:700;padding:4px 6px;border-bottom:1.5px solid var(--line)}
table.vals td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.vals td.n{font-weight:700}
table.vals td.u,table.vals span.u{color:var(--muted);font-size:.78rem}
table.vals td.r{color:var(--muted);font-size:.82rem}
table.vals input{padding:6px 8px;width:5.2em;text-align:right}
table.vals tr.gap td{border-bottom:none;padding:3px}
.flag{display:inline-block;text-align:center;font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 6px}
.flag.hi{background:var(--hi-soft);color:var(--hi)}.flag.lo{background:var(--lo-soft);color:var(--lo)}
.sigprev{max-height:70px;background:#fff;border-radius:8px;padding:4px;border:1px solid var(--line)}

/* Folha do laudo: sempre papel branco, como sai do Word */
.paperbox{position:sticky;top:12px}
.paperwrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;min-width:520px;padding:24px 34px 20px;font-family:Calibri,Carlito,Arial,sans-serif;font-size:12.5px}
.paper .logo{display:block;margin:0 auto 18px;width:170px}
.paper .hd{display:grid;grid-template-columns:repeat(4,1fr);gap:7px 10px;margin-bottom:22px}
.paper .hd div{min-width:0}.paper .hd .w2{grid-column:span 2}.paper .hd .w4{grid-column:span 4}
.paper h3{font-family:"Arial Narrow",Arial,sans-serif;font-size:26px;text-align:center;margin:8px 0 16px;font-weight:700}
.paper table{width:100%;border-collapse:collapse;font-family:Arial,"Liberation Sans",sans-serif;font-size:12px}
.paper td{padding:1.5px 0;vertical-align:top}
.paper td:first-child{font-weight:700;width:34%}
.paper td:nth-child(2){width:38%}
.paper tr.sp td{height:12px}
.paper .sig{display:block;width:130px;margin:26px 0 0 auto}
.paper .foot{border-top:2px solid #111;margin-top:14px;padding-top:6px;text-align:center;font-weight:700;font-size:10.5px;font-family:Arial,sans-serif}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="brand">
  <div class="brand-in">
    <img src="logo-header.png" alt="Zog Hospital Veterinário">
    <div class="ttl">
      <h1>Laudo de Hemograma</h1>
      <p>Canino · padrão do hospital</p>
    </div>
    <button class="gear" id="gearBtn" type="button">Configurações</button>
  </div>
</header>

<div class="wrap">
  <section class="card setup" id="setup" hidden>
    <h2>Configurações</h2>
    <p class="small" style="margin-bottom:12px">Fica salvo só neste aparelho.</p>
    <div class="fields">
      <div class="f s6"><span class="lbl">Assinatura do laudo</span>
        <div class="row">
          <button type="button" id="sigDocBtn">Pegar do modelo .docx do hospital</button>
          <button type="button" id="sigImgBtn">Usar uma imagem</button>
          <input type="file" id="sigDoc" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
          <input type="file" id="sigImg" accept="image/*" hidden>
        </div>
        <div class="row"><img id="sigPrev" class="sigprev" alt="Assinatura salva" hidden><span class="small" id="sigStatus"></span></div>
      </div>
      <div class="f s6"><label for="medicoPadrao">Médico(a) Veterinário(a) padrão</label><input id="medicoPadrao" placeholder="Dra. ..."></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="saveSetup" type="button">Salvar</button>
      <span class="status" id="setupStatus"></span>
    </div>
  </section>

  <div class="grid" style="margin-top:16px">
    <div class="col">
      <section class="card">
        <h2><span class="step">1</span> Paciente</h2>
        <div class="fields">
          <div class="f s3"><label for="animal">Nome do animal</label><input id="animal"></div>
          <div class="f s3"><label for="tutor">Tutor(a)</label><input id="tutor"></div>
          <div class="f s2 half"><label for="especie">Espécie</label><input id="especie" value="Canina"></div>
          <div class="f s2 half"><label for="raca">Raça</label><input id="raca"></div>
          <div class="f s2 half"><label for="sexo">Sexo</label><select id="sexo"><option>M</option><option>F</option></select></div>
          <div class="f s3"><label for="idadeN">Idade</label>
            <div class="age"><input id="idadeN" inputmode="numeric"><select id="idadeU" aria-label="Unidade da idade"><option value="anos">anos</option><option value="meses">meses</option></select></div>
          </div>
          <div class="f s3 half"><label for="data">Data</label><input id="data" type="date"></div>
          <div class="f s6"><label for="medico">Médico(a) Veterinário(a)</label><input id="medico" placeholder="Dra. ..."></div>
        </div>
        <div class="row" style="margin-top:14px"><button type="button" id="newBtn">Novo laudo (limpar tudo)</button></div>
      </section>

      <section class="card">
        <h2><span class="step">2</span> Valores do exame</h2>
        <div class="refbar">
          <span class="lbl">Referência</span>
          <select id="refSel" aria-label="Tabela de referência" style="width:auto">
            <option value="auto">Automática pela idade</option>
            <option value="filhote">Filhote 6 a 12 meses</option>
            <option value="adulto">Adulto 1 a 8 anos</option>
          </select>
          <span class="pill" id="refPill"></span>
        </div>
        <p class="note" id="refNote" hidden></p>
        <div class="tbl"><table class="vals" id="vals"></table></div>
        <p class="small">Valor absoluto do diferencial em branco é calculado pelos leucócitos × %, arredondado à centena.</p>
      </section>
    </div>

    <div class="col paperbox">
      <section class="card">
        <h2><span class="step">3</span> Laudo</h2>
        <div class="paperwrap"><div class="paper" id="paper"></div></div>
        <div class="actions">
          <button class="primary" id="shareBtn" type="button">Enviar / salvar laudo</button>
          <button id="dlBtn" type="button">Baixar .docx</button>
          <button id="copyBtn" type="button">Copiar texto</button>
        </div>
        <p class="status" id="dlStatus"></p>
      </section>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
