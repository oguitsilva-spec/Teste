<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDV Avivados</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--tx:#222;--mu:#777;--pr:#7a1f2b;--ok:#1d7a3a;--bd:#ddd}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pr);color:#fff;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header h1{font-size:18px;margin:0 12px 0 0}
nav button{background:transparent;color:#fff;border:1px solid #fff6;padding:8px 14px;border-radius:6px;cursor:pointer}
nav button.on{background:#fff;color:var(--pr)}
main{padding:16px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
input,select{padding:9px;border:1px solid var(--bd);border-radius:6px;font-size:15px}
button.b{padding:9px 14px;border:0;border-radius:6px;background:var(--pr);color:#fff;cursor:pointer;font-size:15px}
button.g{background:var(--ok)}button.s{background:#eee;color:#222}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:left}
td.n,th.n{text-align:right}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tot{font-size:42px;font-weight:700;color:var(--ok);text-align:right}
.low{color:#c00;font-weight:600}.mu{color:var(--mu);font-size:12px}
#scan{font-size:20px;flex:1;min-width:200px}
.tbl{overflow-x:auto}
#labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.lbl{border:1px dashed #999;padding:6px;text-align:center;background:#fff;break-inside:avoid}
.lbl b{display:block;font-size:12px}.lbl svg{width:100%;height:60px}
video{width:100%;max-width:400px;border-radius:8px}
@media print{header,.np{display:none!important}main{padding:0}.card{border:0}}
</style>
</head>
<body>
<header><h1>✝ PDV Avivados</h1><nav>
<button data-t="venda" class="on">Venda</button><button data-t="estoque">Estoque</button><button data-t="etiquetas">Códigos de barra</button><button data-t="vendas">Histórico</button>
</nav></header>
<main>
<section id="venda">
 <div class="card"><div class="row">
  <input id="scan" placeholder="Bipe o código de barras ou digite o nome" autocomplete="off" list="dl">
  <datalist id="dl"></datalist>
  <button class="b s" id="cam">📷 Câmera</button>
 </div><video id="vid" hidden playsinline></video><div id="msg" class="mu"></div></div>
 <div class="card tbl"><table><thead><tr><th>Produto</th><th class="n">Preço</th><th class="n">Qtd</th><th class="n">Subtotal</th><th></th></tr></thead><tbody id="cart"></tbody></table>
 <div class="tot" id="total">R$ 0,00</div>
 <div class="row" style="justify-content:flex-end">
  <select id="pag"><option>Dinheiro</option><option>Pix</option><option>Débito</option><option>Crédito</option></select>
  <input id="rec" type="number" step="0.01" placeholder="Valor recebido" style="width:140px"><span id="troco" class="mu"></span>
  <button class="b s" id="limpar">Cancelar</button><button class="b g" id="fin">Finalizar venda</button>
 </div></div>
</section>

<section id="estoque" hidden>
 <div class="card"><h3 style="margin-top:0">Cadastrar / dar entrada</h3>
  <div class="row">
   <input id="pNome" placeholder="Nome do produto" style="flex:2;min-width:180px">
   <input id="pCat" placeholder="Categoria" list="cats" style="width:140px"><datalist id="cats"></datalist>
   <input id="pPreco" type="number" step="0.01" placeholder="Preço R$" style="width:110px">
   <input id="pQtd" type="number" placeholder="Qtd" style="width:80px">
   <label class="mu"><input type="checkbox" id="pRepor" checked> repor</label>
   <button class="b" id="pAdd">Cadastrar</button>
  </div>
  <div class="row" style="margin-top:10px">
   <input id="eCod" placeholder="Entrada: bipe o código" style="flex:1">
   <input id="eQtd" type="number" placeholder="Qtd" style="width:80px" value="1">
   <button class="b g" id="eAdd">Dar entrada</button>
  </div>
 </div>
 <div class="card"><div class="row"><input id="busca" placeholder="Buscar..." style="flex:1">
  <button class="b s" id="exp">Exportar backup</button><label class="b s" style="padding:9px 14px;border-radius:6px;background:#eee;cursor:pointer">Importar<input type="file" id="imp" hidden accept=".json"></label></div>
  <div class="tbl"><table><thead><tr><th>Código</th><th>Produto</th><th>Categoria</th><th class="n">Preço</th><th class="n">Estoque</th><th></th></tr></thead><tbody id="lista"></tbody></table></div>
  <p class="mu" id="resumo"></p>
 </div>
</section>

<section id="etiquetas" hidden>
 <div class="card np row"><label>Cópias por produto <input id="copias" type="number" value="1" min="1" style="width:70px"></label>
  <label><input type="checkbox" id="soEst"> só com estoque (cópias = qtd)</label>
  <button class="b" onclick="print()">🖨 Imprimir</button></div>
 <div id="labels"></div>
</section>

<section id="vendas" hidden>
 <div class="card"><div class="row"><input type="date" id="dia"><b id="vTot"></b></div>
 <div class="tbl"><table><thead><tr><th>Hora</th><th>Itens</th><th>Pagamento</th><th class="n">Total</th></tr></thead><tbody id="hist"></tbody></table></div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id),R=v=>'R$ '+(+v).toFixed(2).replace('.',',');
const SEED=[["Caneta",15,"Acessórios"],["Chaveiro de metal",24,"Acessórios"],["Chaveiro de borracha",2,"Acessórios"],["Pin",15,"Acessórios"],
["Pulseira de borracha / São Bento",15,"Pulseiras"],["Pulseira fina de borracha",6,"Pulseiras"],["Pulseira média de Jesus",5,"Pulseiras"],
["Imagem de São Miguel",35,"Imagens"],["Pulseira de metal",25.9,"Pulseiras"],["Pulseira de cordinha trançada",29.9,"Pulseiras"],
["Pulseira de Nossa Senhora",19.9,"Pulseiras"],["Pulseira branca de Nossa Senhora",19.9,"Pulseiras"],["Pulseira dos Santos",34.9,"Pulseiras"],
["Pulseira de nylon",10,"Pulseiras"],["Escapulário",39.9,"Acessórios"],["Terço infantil",19.9,"Terços"],["Bolsinha de terço",29.9,"Terços"],
["Camiseta Padre Pio",90,"Camisetas",1],["Camiseta Nossa Senhora de Pentecostes",90,"Camisetas",1],["Camiseta Aviva-me 2026 (Sarça)",90,"Camisetas",1],
["Camiseta Nossa Senhora de Guadalupe",90,"Camisetas",1],["Camiseta Totus Tuus",90,"Camisetas",1],["Camiseta Carlo Acutis",90,"Camisetas",1],
["Camiseta Maria Passa na Frente",90,"Camisetas",1]];
const ean=n=>{const b='2'+String(n).padStart(11,'0');let s=0;for(let i=0;i<12;i++)s+=+b[i]*(i%2?3:1);return b+((10-s%10)%10)};
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],
 G=L.map(x=>[...x].map(c=>c^1).reverse().join('')),Rr=L.map(x=>[...x].map(c=>c^1).join('')),
 PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function bars(c){let b='101';for(let i=1;i<7;i++)b+=(PAR[c[0]][i-1]=='L'?L:G)[c[i]];b+='01010';for(let i=7;i<13;i++)b+=Rr[c[i]];b+='101';
 let r='';[...b].forEach((x,i)=>{if(x=='1')r+=`<rect x="${i+9}" y="0" width="1" height="${[0,1,2,45,46,47,48,49,92,93,94].includes(i)?56:50}"/>`});
 return`<svg viewBox="0 0 113 66" xmlns="http://www.w3.org/2000/svg">${r}<g font-size="9" font-family="monospace" text-anchor="middle"><text x="4" y="64">${c[0]}</text><text x="33" y="64">${c.slice(1,7)}</text><text x="79" y="64">${c.slice(7)}</text></g></svg>`}
let db;try{db=JSON.parse(localStorage.pdvAvivados)}catch(e){}
if(!db){db={seq:0,prods:[],vendas:[]};SEED.forEach(([n,p,c,r])=>novo(n,p,c,0,!!r))}
let cart=[];
function save(){try{localStorage.pdvAvivados=JSON.stringify(db)}catch(e){alert('Erro ao salvar')}}
function novo(nome,preco,cat,qtd,repor){db.seq++;const p={cod:ean(db.seq),nome,preco:+preco,cat,qtd:+qtd||0,repor};db.prods.push(p);save();return p}
const find=c=>db.prods.find(p=>p.cod===c.trim())||db.prods.find(p=>p.nome.toLowerCase()===c.trim().toLowerCase());
function msg(t,ok){$('msg').textContent=t;$('msg').style.color=ok?'var(--ok)':'#c00'}
// abas
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==b.dataset.t);render();if(b.dataset.t==='venda')$('scan').focus()});
// venda
function addCart(c){const p=find(c);if(!p)return msg('Produto não encontrado: '+c);const it=cart.find(i=>i.cod===p.cod);
 const q=(it?it.q:0)+1;if(q>p.qtd&&!confirm(p.nome+': estoque '+p.qtd+'. Vender mesmo assim?'))return;
 it?it.q++:cart.push({cod:p.cod,nome:p.nome,preco:p.preco,q:1});msg('+ '+p.nome+' '+R(p.preco),1);rCart()}
function rCart(){let t=0;$('cart').innerHTML=cart.map((i,k)=>{t+=i.preco*i.q;return`<tr><td>${i.nome}</td><td class=n>${R(i.preco)}</td><td class=n>
 <button class="b s" onclick="q(${k},-1)">−</button> ${i.q} <button class="b s" onclick="q(${k},1)">+</button></td><td class=n>${R(i.preco*i.q)}</td>
 <td><button class="b s" onclick="q(${k},-1e9)">✕</button></td></tr>`}).join('');$('total').textContent=R(t);troco();return t}
window.q=(k,d)=>{cart[k].q+=d;if(cart[k].q<1)cart.splice(k,1);rCart()};
function troco(){const t=cart.reduce((a,i)=>a+i.preco*i.q,0),r=+$('rec').value;$('troco').textContent=r?'Troco: '+R(r-t):''}
$('rec').oninput=troco;
$('scan').onkeydown=e=>{if(e.key==='Enter'&&$('scan').value){addCart($('scan').value);$('scan').value=''}};
$('limpar').onclick=()=>{if(cart.length&&confirm('Cancelar venda?')){cart=[];rCart()}};
$('fin').onclick=()=>{if(!cart.length)return;const t=rCart();
 cart.forEach(i=>{const p=db.prods.find(x=>x.cod===i.cod);if(p)p.qtd-=i.q});
 db.vendas.push({d:new Date().toISOString(),itens:cart,total:t,pag:$('pag').value});save();
 cart=[];$('rec').value='';rCart();msg('Venda finalizada: '+R(t),1);$('scan').focus()};
// câmera
let stream;$('cam').onclick=async()=>{const v=$('vid');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;v.hidden=true;return}
 if(!('BarcodeDetector'in window))return msg('Câmera não suportada neste navegador (use Chrome no Android ou um leitor USB).');
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.hidden=false;await v.play();
 const det=new BarcodeDetector({formats:['ean_13','code_128']});let last='',lt=0;
 (async function loop(){if(!stream)return;try{const r=await det.detect(v);if(r[0]){const c=r[0].rawValue,n=Date.now();
  if(c!==last||n-lt>1500){last=c;lt=n;$('estoque').hidden?addCart(c):($('eCod').value=c)}}}catch(e){}requestAnimationFrame(loop)})()};
// estoque
$('pAdd').onclick=()=>{const n=$('pNome').value.trim(),pr=$('pPreco').value;if(!n||!pr)return alert('Informe nome e preço');
 const p=novo(n,pr,$('pCat').value||'Geral',$('pQtd').value,$('pRepor').checked);['pNome','pPreco','pQtd'].forEach(i=>$(i).value='');render();alert('Cadastrado! Código: '+p.cod)};
$('eAdd').onclick=()=>{const p=find($('eCod').value);if(!p)return alert('Código não encontrado');p.qtd+=+$('eQtd').value||0;save();$('eCod').value='';$('eQtd').value=1;render()};
$('eCod').onkeydown=e=>{if(e.key==='Enter')$('eAdd').click()};
$('busca').oninput=render;
window.ed=(c,f)=>{const p=db.prods.find(x=>x.cod===c),l={nome:'Nome',preco:'Preço',qtd:'Quantidade em estoque',cat:'Categoria'}[f];
 const v=prompt(l,p[f]);if(v===null)return;p[f]=f==='preco'||f==='qtd'?+v.replace(',','.'):v;save();render()};
window.del=c=>{if(confirm('Excluir produto?')){db.prods=db.prods.filter(p=>p.cod!==c);save();render()}};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)]));a.download='pdv-avivados-backup.json';a.click()};
$('imp').onchange=e=>{const f=e.target.files[0];f&&f.text().then(t=>{if(confirm('Substituir todos os dados?')){db=JSON.parse(t);save();render()}})};
function render(){const s=$('busca').value.toLowerCase();let tq=0,tv=0;
 $('dl').innerHTML=db.prods.map(p=>`<option value="${p.nome}">`).join('');
 $('cats').innerHTML=[...new Set(db.prods.map(p=>p.cat))].map(c=>`<option value="${c}">`).join('');
 $('lista').innerHTML=db.prods.filter(p=>(p.nome+p.cod+p.cat).toLowerCase().includes(s)).map(p=>{tq+=p.qtd;tv+=p.qtd*p.preco;
  return`<tr><td>${p.cod}</td><td onclick="ed('${p.cod}','nome')">${p.nome}${p.repor?'':' <span class=mu>(não repor)</span>'}</td><td onclick="ed('${p.cod}','cat')">${p.cat}</td>
  <td class=n onclick="ed('${p.cod}','preco')">${R(p.preco)}</td><td class="n ${p.qtd<=0?'low':''}" onclick="ed('${p.cod}','qtd')">${p.qtd}</td>
  <td><button class="b s" onclick="del('${p.cod}')">🗑</button></td></tr>`}).join('');
 $('resumo').textContent=`${db.prods.length} produtos · ${tq} peças · ${R(tv)} em estoque · clique num campo para editar`;
 // etiquetas
 const cp=+$('copias').value||1,so=$('soEst').checked;$('labels').innerHTML='';
 db.prods.forEach(p=>{const n=so?Math.max(0,p.qtd):cp;for(let i=0;i<n;i++){const d=document.createElement('div');d.className='lbl';
  d.innerHTML=`<b>${p.nome}</b><svg></svg><b>${R(p.preco)}</b>`;$('labels').append(d);
  d.querySelector('svg').outerHTML=bars(p.cod)}});
 // histórico
 const dia=$('dia').value||($('dia').value=new Date().toLocaleDateString('sv'));let st=0;
 $('hist').innerHTML=db.vendas.filter(v=>new Date(v.d).toLocaleDateString('sv')===dia).reverse().map(v=>{st+=v.total;
  return`<tr><td>${new Date(v.d).toLocaleTimeString().slice(0,5)}</td><td>${v.itens.map(i=>i.q+'x '+i.nome).join(', ')}</td><td>${v.pag}</td><td class=n>${R(v.total)}</td></tr>`}).join('');
 $('vTot').textContent='Total do dia: '+R(st)}
$('copias').oninput=$('soEst').onchange=$('dia').onchange=render;
render();rCart();$('scan').focus();
</script>
</body>
</html>
